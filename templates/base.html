<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIT Scan System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link
      rel="shortcut icon"
      href="{% static 'favicon.ico' %}"
      type="image/x-icon"
    />
  </head>
  <body class="bg-gray-100">
    <nav class="bg-[#17211B] text-white p-4">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">KIT Upload System</h1>
      </div>
    </nav>

    <main class="container mx-auto p-4">{% block content %}{% endblock %}</main>

    <script>
      // Function to open camera for image capture
      function openCamera(inputId) {
        const input = document.getElementById(inputId);
        input.click();
      }

      // Function to preview image before upload
      function previewImage(event, previewId) {
        const reader = new FileReader();
        reader.onload = function () {
          const preview = document.getElementById(previewId);
          preview.src = reader.result;
          preview.classList.remove("hidden");
        };
        reader.readAsDataURL(event.target.files[0]);
      }
    </script>
  </body>
</html>
